server.port=8080

spring.application.name=vortex-video
management.metrics.tags.application=${spring.application.name}

#MYSQL LOCAL

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/streaming_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alejandro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:alejandro}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
logging.level.org.hibernate.SQL=debug
spring.jackson.time-zone=America/Mexico_City

media.scan.root=${MEDIA_SCAN_ROOT:C:/Users/AlejandroAgRa/Videos/4K Video Downloader+}
media.thumbnail.root=${MEDIA_THUMBNAIL_ROOT:C:/Users/AlejandroAgRa/Videos/Capturasx/thumbnails}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoint.prometheus.access=unrestricted

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true